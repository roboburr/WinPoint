[package]
name = "win11-calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Windows 11 style Calendar app for Win11 GNOME (GTK 4)"

[[bin]]
name = "win11-calendar"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
serde_json = "1"
libc = "0.2"
