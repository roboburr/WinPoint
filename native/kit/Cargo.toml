[package]
name = "win11-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Shared GTK 4 toolkit of the native Win11 GNOME apps: backend client, theme, Windows 11 window frame and controls"

[lib]
name = "kit"
path = "src/lib.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
serde_json = "1"
libc = "0.2"

[[example]]
name = "gallery"
path = "examples/gallery.rs"
