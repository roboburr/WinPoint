[package]
name = "win11-gtk-taskmgr"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Win11 GNOME Task Manager in GTK 4"

[[bin]]
name = "win11-gtk-taskmgr"
path = "src/main.rs"

[dependencies]
kit = { package = "win11-kit", path = "../../kit" }
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
serde_json = "1"
libc = "0.2"
