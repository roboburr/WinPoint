# The native GTK 4 programs: the shell (D-G63), the Calendar and the seven apps (native/apps on the shared
# native/kit, APPS.md). Their own workspace, because gtk4-rs 0.11 needs a newer glib than the host in ../host
# (glib, gio and gdk-pixbuf 0.18, no GTK since D-G72), and Cargo allows one glib-sys per workspace. Crates and
# build output live on the 22 TB disk (Robin, 12-11): CARGO_HOME and CARGO_TARGET_DIR under
# /run/media/robin/22TB/win11-gnome-build.
[workspace]
members = [
    "shell",
    "calendar",
    "kit",
    "apps/explorer",
    "apps/settings",
    "apps/taskmgr",
    "apps/alles",
    "apps/disks",
    "apps/defaultapps",
    "apps/installer",
]
resolver = "2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
