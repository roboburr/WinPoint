# The native GTK 4 shell (D-G63): its own workspace, because gtk4-rs 0.11 needs a newer glib than the GTK 3 /
# WebKit host in ../host (gtk 0.18, glib 0.18), and Cargo allows one glib-sys per workspace. Crates and build
# output live on the 22 TB disk (Robin, 12-11): CARGO_HOME and CARGO_TARGET_DIR under
# /run/media/robin/22TB/win11-gnome-build.
[workspace]
members = ["shell", "calendar"]
resolver = "2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
