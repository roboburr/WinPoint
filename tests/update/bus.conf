<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  GW1: the private buses of the fake PackageKit / NetworkManager (tests/update/run.sh, design 9.1 and 4.11).

  * Only ever started by tests/update/run.sh inside its bubblewrap layer, where /tmp is a private tmpfs of
    that one sandbox, so the fixed directory below is unique per run and vanishes with the sandbox.
  * unix:dir makes dbus-daemon pick a fresh socket name (dbus-XXXXXXXXXX); the layer reads the address from
    print-address.
  * The private session bus uses this file as it is: no servicedir, no standard_session_servicedirs, no
    standard_system_servicedirs, no servicehelper, no include and no includedir, so nothing can be activated
    there (no second at-spi bus, no real service).
  * The private system bus (the fake's) uses a wrapper that fake_packagekit.py generates in <run>/bus-system.conf:
    an <include> of exactly this file plus ONE <servicedir>, <run>/services. That directory is empty or holds only
    the generated org.freedesktop.PackageKit.service, whose Exec asks the fake to own the name again (the
    "installed but idle, D-Bus activated" state of packagekitd). The guard refuses any other file there.
  * EXTERNAL auth only; every peer is the same uid inside the same sandbox, so the policy allows sending and
    owning everything. No eavesdropping (the real system bus does not allow it, and nothing here needs it).
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <!-- The sandbox's /sys is read-only, so dbus-daemon cannot query AppArmor; all peers are ours anyway. -->
  <apparmor mode="disabled"/>
  <listen>unix:dir=/tmp/w11-update</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*"/>
    <!-- As in the real system.conf: receive rules without eavesdrop="true" do not allow eavesdropping. -->
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_type="signal"/>
    <allow own="*"/>
  </policy>
</busconfig>
