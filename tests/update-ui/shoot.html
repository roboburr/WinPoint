<!doctype html>
<meta charset="utf-8">
<title>update screenshot</title>
<!-- One surface of tests/i18n/surfaces.json in mock mode, full window, for a headless Chrome --screenshot (GW3,
     tests/update-ui/shoot.sh). The same steps as tests/i18n/dump.html: the page runs to its logical stop time
     (tests/i18n/freeze.js), CSS animations are finished, the entry's "do" actions run, and the frame stays on screen.
     Query: ?id=<surface id> · ?lang=nl|en · ?theme=light|dark (default light). Sets document.title to DONE <id> (or
     FAILED …) when the frame is ready. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #888; }
  iframe { border: 0; display: block; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; }
</style>
<script type="module">
const Q = new URLSearchParams(location.search);
const ID = Q.get('id') || '';
const LANG = Q.get('lang') === 'en' ? 'en' : 'nl';
const THEME = Q.get('theme') === 'dark' ? 'dark' : 'light';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(pred, ms, step = 50) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    try { const v = pred(); if (v) return v; } catch { /* not yet */ }
    await sleep(step);
  }
  return null;
}
// Infinite animations cannot finish. The indeterminate ProgressRing's stroke (fl-ring-dash) is a dot at its start,
// so it is held at mid-cycle, where the arc is longest (H02 "checking"); every other one stays where it is.
const HOLD = { 'fl-ring-dash': 0.5 };
function finishAnimations(doc) {
  try {
    doc.getAnimations().forEach((a) => {
      try { a.finish(); } catch {
        try {
          const at = HOLD[a.animationName];
          if (at != null) { a.pause(); a.currentTime = at * Number(a.effect.getTiming().duration || 0); }
        } catch { /* leave it */ }
      }
    });
  } catch { /* ignore */ }
}
async function main() {
  const cfg = await (await fetch('/tests/i18n/surfaces.json', { cache: 'no-store' })).json();
  const spec = cfg.surfaces.find((s) => s.id === ID);
  if (!spec) { document.title = `FAILED no surface ${ID}`; return; }
  const stop = spec.wait ?? cfg.defaults?.wait ?? 2500;
  try { localStorage.clear(); sessionStorage.clear(); } catch { /* ignore */ }
  if (spec.seed) localStorage.setItem('win11shell.mock.settings', JSON.stringify(spec.seed));
  const f = document.createElement('iframe');
  f.src = `/ui/index.html?${spec.q}&mock=1${spec.seed ? '' : '&mockreset=1'}&mockStatic=1&theme=${THEME}&lang=${LANG}&i18nstop=${stop}`;
  document.body.append(f);
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const doc = f.contentDocument, win = f.contentWindow;
  const fz = () => win.__i18nFreeze;
  await until(() => doc.documentElement.dataset.ready === 'true', 15000);
  await until(() => fz()?.idle(), stop + 15000);
  for (let i = 0; i < 3; i++) { finishAnimations(doc); await sleep(300); await until(() => fz()?.idle(), 15000); }
  for (const step of spec.do || []) {
    const kind = ['click', 'contextmenu'].find((k) => typeof step[k] === 'string');
    const all = kind ? [...doc.querySelectorAll(step[kind])] : [];
    const el = all[(step.nth || 0) < 0 ? all.length + step.nth : (step.nth || 0)];
    if (!el) { document.title = `FAILED do ${step[kind]}`; return; }
    if (kind === 'click') el.click();
    else el.dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, buttons: 2 }));
    fz()?.extend(step.wait ?? 1500);
    for (let i = 0; i < 3; i++) { await sleep(300); finishAnimations(doc); await until(() => fz()?.idle(), 15000); }
  }
  finishAnimations(doc);
  // keep the opened row (R04/R05) on screen: scroll the page so the expanded row is visible
  const open = doc.querySelector('.st-updrow.is-expanded');
  if (open && !doc.querySelector('.fl-dialog-layer')) { try { open.scrollIntoView({ block: 'start' }); } catch { /* ignore */ } }
  document.title = `DONE ${ID}`;
}
main().catch((e) => { document.title = `FAILED ${e?.message || e}`; });
</script>
