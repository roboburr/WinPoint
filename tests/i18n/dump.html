<!doctype html>
<meta charset="utf-8">
<title>i18n text dump</title>
<!-- UI text dump (H: notes/english-option-design.md §3.3, step E0b; ported to Win11 voor GNOME in GE0a,
     notes/claude/round0/ge0a.md). Run by tests/i18n/run.sh in headless Chrome (--dump-dom, virtual time), served by
     tests/i18n/serve.py (/ui/ = vendor/ui). Opens every entry of surfaces.json in a same-origin iframe (mock mode,
     ?lang=…&i18ncheck=1), waits a fixed virtual time, optionally runs the entry's harness actions ("do": a click or
     a context menu on a selector, for G surfaces that have no ?open= hook), and writes every text node and the
     visible-text attributes of the frame into #out, one "== id url ==" block per surface. An entry's "probe" (R3-UI)
     adds a line per check of a state the text does not show: "# probe disabled|inview <selector>: true|false|none".
     Query: ?lang=nl|en (default nl) · ?only=id,id (a subset) · ?list=1 (only print the surface ids) ·
     ?timing=1 (add when each page got ready; debugging only).
     #notes (JSON, not part of the dump; run.sh prints a summary and --notes FILE keeps it): the frames without a
     window.__i18n report, and per surface the console errors/warnings, uncaught errors and unhandled rejections
     freeze.js collected (an unknown mock method among them). G's core/i18n.js at 3b898e6 has no ?i18ncheck=1 (H's
     E0a adds it, GE1a ports it), so that absence is kept out of the blocks: the nl baseline then stays comparable
     once the report exists (its lines only appear when they are not empty). -->
<style>iframe { border: 0; display: block; position: absolute; left: 0; top: 0; }</style>
<pre id="out">RUNNING</pre>
<pre id="notes"></pre>
<script type="module">
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') === 'en' ? 'en' : 'nl';
const ONLY = (Q.get('only') || '').split(',').filter(Boolean);
const TIMING = Q.get('timing') === '1';      // debugging only: when each page got ready (never in a baseline)
const OUT = document.getElementById('out');
const NOTES = document.getElementById('notes');
const notes = { surfaces: 0, noReport: [], console: {} };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// the attributes that carry visible (or spoken) text (§3.3)
const ATTRS = ['aria-label', 'title', 'placeholder', 'alt', 'aria-description', 'aria-valuetext', 'data-tooltip',
  'aria-roledescription', 'aria-placeholder'];
const SKIP = new Set(['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEMPLATE']);
const TEXT_INPUT = /^(text|search|url|email|tel|number|password|button|submit|reset|)$/;

const norm = (s) => String(s ?? '').replace(/\s+/g, ' ').trim();

/** Every text node, the text attributes and the value of text inputs, in document order. Text inside inline
 *  elements joins its neighbours (an access-key underline "S<u>y</u>steem" is one line "Systeem"); every other box
 *  (block, inline-block, flex, a button, an input, display:none) starts a line of its own. Attributes of an inline
 *  element follow the line their text is part of. */
function serialize(doc, lines, depth = 0) {
  const ind = depth ? '  '.repeat(depth) : '';
  const view = doc.defaultView;
  let buf = '';
  let pending = [];
  const flush = () => {
    const s = norm(buf);
    if (s) lines.push(ind + s);
    buf = '';
    for (const l of pending) lines.push(l);
    pending = [];
  };
  const attrs = (el, out) => {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = norm(el.getAttribute(a));
      if (v) out.push(`${ind}[${a}] ${v}`);
    }
  };
  const walk = (node) => {
    if (node.nodeType === 3) { buf += node.nodeValue; return; }
    if (node.nodeType !== 1) return;
    const el = node;
    if (SKIP.has(el.tagName)) return;
    let display = 'block';
    try { display = view.getComputedStyle(el).display; } catch { /* detached */ }
    const inline = (display === 'inline' || display === 'contents') && el.tagName !== 'BR' &&
      el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA' && el.tagName !== 'IFRAME';
    if (inline) {
      attrs(el, pending);
    } else {
      flush();
      attrs(el, lines);
      if ((el.tagName === 'INPUT' && TEXT_INPUT.test(el.type || '')) || el.tagName === 'TEXTAREA') {
        const v = norm(el.value);
        if (v) lines.push(`${ind}[value] ${v}`);
      }
    }
    if (el.tagName === 'IFRAME') {
      let sub = null;
      try { sub = el.contentDocument; } catch { sub = null; }
      lines.push(`${ind}-- frame ${frameUrl(el.getAttribute('src') || '')} --`);
      if (sub?.documentElement) {
        const tt = norm(sub.title);
        if (tt) lines.push(`${ind}  # title: ${tt}`);
        serialize(sub, lines, depth + 1);
      }
      return;
    }
    if (el.shadowRoot) for (const c of el.shadowRoot.childNodes) walk(c);
    for (const c of el.childNodes) walk(c);
    if (!inline) flush();
  };
  if (doc.body) walk(doc.body);
  flush();
  return lines;
}

/** A frame URL without the run's own flags and port. */
function frameUrl(src) {
  try {
    const u = new URL(src, location.href);
    for (const k of ['token']) u.searchParams.delete(k);
    return u.pathname + (u.search ? '?' + decodeURIComponent(u.searchParams.toString()) : '');
  } catch { return src; }
}

async function until(pred, ms, step = 50) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    try { const v = pred(); if (v) return v; } catch { /* not yet */ }
    await sleep(step);
  }
  return null;
}

function finishAnimations(doc) {
  try { doc.getAnimations().forEach((a) => { try { a.finish(); } catch { /* infinite: leave it */ } }); } catch { /* ignore */ }
}

/** The harness actions of a surface (surfaces.json "do"): [{click|contextmenu: selector, nth?, wait?}] (nth: which
 *  match, 0 the first, -1 the last). Each runs
 *  after the page is idle at its stop time; then the stop time moves on by `wait` (default cfg.doWait) logical ms
 *  (freeze.js extend) and the page runs until it is idle again. */
async function act(f, spec, cfg, lines) {
  const doc = f.contentDocument, win = f.contentWindow;
  for (const step of spec.do || []) {
    const kind = ['click', 'contextmenu'].find((k) => typeof step[k] === 'string');
    const sel = kind ? step[kind] : '';
    const all = kind ? [...doc.querySelectorAll(sel)] : [];
    const el = all[(step.nth || 0) < 0 ? all.length + step.nth : (step.nth || 0)];   // nth -1: the last match
    lines.push(`# do: ${kind || '?'} ${sel}${step.nth ? ` [${step.nth}]` : ''}`);
    if (!el) { lines.push(`# DO FAILED (${all.length} element(s) match, nth ${step.nth || 0})`); return; }
    try { el.scrollIntoView({ block: 'center', inline: 'center' }); } catch { /* ignore */ }
    const r = el.getBoundingClientRect();
    const at = { bubbles: true, cancelable: true, composed: true, view: win, clientX: Math.round(r.left + r.width / 2),
      clientY: Math.round(r.top + r.height / 2) };
    if (kind === 'click') el.click();
    else el.dispatchEvent(new win.MouseEvent('contextmenu', { ...at, button: 2, buttons: 2 }));
    win.__i18nFreeze?.extend(step.wait ?? cfg.doWait);
    for (let i = 0; i < 3; i++) {
      await sleep(cfg.after);
      finishAnimations(doc);
      await until(() => win.__i18nFreeze?.idle(), cfg.readyTimeout);
    }
  }
}

/** The checks of a surface (surfaces.json "probe"): [{disabled|inview: selector, nth?}], after its actions. One line
 *  each: "# probe disabled <sel>: true|false" (the element's disabled property, or aria-disabled="true"), "# probe
 *  inview <sel>: true|false" (its top edge inside the frame's viewport: a deep link scrolled it into view), "none"
 *  when nothing matches. Only entries with a probe get these lines (R3-UI). */
function probe(f, spec, lines) {
  const doc = f.contentDocument, win = f.contentWindow;
  for (const step of spec.probe || []) {
    const kind = ['disabled', 'inview'].find((k) => typeof step[k] === 'string');
    const sel = kind ? step[kind] : '';
    const all = kind ? [...doc.querySelectorAll(sel)] : [];
    const el = all[(step.nth || 0) < 0 ? all.length + step.nth : (step.nth || 0)];
    let v = 'none';
    if (el && kind === 'disabled') v = String(!!el.disabled || el.getAttribute('aria-disabled') === 'true');
    if (el && kind === 'inview') {
      const r = el.getBoundingClientRect();
      v = String(r.height > 0 && r.top >= 0 && r.top < win.innerHeight);
    }
    lines.push(`# probe ${kind || '?'} ${sel}${step.nth ? ` [${step.nth}]` : ''}: ${v}`);
  }
}

async function dumpOne(spec, cfg) {
  try { localStorage.clear(); sessionStorage.clear(); } catch { /* ignore */ }
  // seed: mock settings the page starts with (mock/settings.js reads them from localStorage; no mockreset then)
  if (spec.seed) localStorage.setItem('win11shell.mock.settings', JSON.stringify(spec.seed));
  const [w, h] = spec.size || cfg.size;
  const stop = spec.wait ?? cfg.wait;
  const flags = `&mock=1${spec.seed ? '' : '&mockreset=1'}&mockStatic=1&theme=light&lang=${LANG}&i18ncheck=1` +
    `&i18nstop=${stop}`;
  const url = `/ui/index.html?${spec.q}${flags}`;
  const f = document.createElement('iframe');
  f.width = w; f.height = h;
  f.src = url;
  document.body.append(f);
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const doc = f.contentDocument;
  const fz = () => f.contentWindow.__i18nFreeze;
  // the page runs until its logical clock reaches `stop` (freeze.js), then holds still
  const ready = await until(() => doc.documentElement.dataset.ready === 'true', cfg.readyTimeout);
  const readyAt = fz()?.now();
  let idle = await until(() => fz()?.idle(), stop + cfg.readyTimeout);
  for (let i = 0; i < 3; i++) {            // CSS animations are not timers: finish them, let their handlers run
    finishAnimations(doc);
    await sleep(cfg.after);
    idle = await until(() => fz()?.idle(), cfg.readyTimeout);
  }
  const lines = [`== ${spec.id} /ui/index.html?${spec.q} ==`];
  if (spec.seed) lines.push(`# seed: ${JSON.stringify(spec.seed)}`);
  if (spec.do) {
    await act(f, spec, cfg, lines);
    idle = await until(() => fz()?.idle(), cfg.readyTimeout);
  }
  if (spec.probe) probe(f, spec, lines);
  if (!ready) lines.push('# NOT READY (data-ready never set)');
  if (!idle) lines.push(`# NOT IDLE (timers due before ${fz()?.stop ?? stop} ms still pending)`);
  if (TIMING) lines.push(`# timing: ready at ${readyAt} ms, stop ${stop} ms, ${fz()?.pending()} timers left`);
  const tt = norm(doc.title);
  if (tt) lines.push(`# title: ${tt}`);
  serialize(doc, lines);
  let rep = { missing: [], unfilled: [], plural: [] };
  if (!f.contentWindow.__i18n) notes.noReport.push(spec.id);
  try { const c = fz()?.console() || []; if (c.length) notes.console[spec.id] = [...c]; } catch { /* ignore */ }
  try { rep = JSON.parse(JSON.stringify(f.contentWindow.__i18n || rep)); } catch { /* ignore */ }
  for (const k of ['missing', 'unfilled', 'plural']) {
    const v = [...(rep[k] || [])].sort();
    if (v.length) lines.push(`# i18n ${k}: ${v.join(' ')}`);
  }
  f.remove();
  await sleep(cfg.gap);
  return lines;
}

async function main() {
  const cfg = await (await fetch('surfaces.json', { cache: 'no-store' })).json();
  const d = { size: [1440, 900], wait: 2500, after: 300, gap: 200, readyTimeout: 15000, doWait: 1500, ...(cfg.defaults || {}) };
  let list = cfg.surfaces;
  if (ONLY.length) list = list.filter((s) => ONLY.includes(s.id) || ONLY.some((o) => o.endsWith('*') && s.id.startsWith(o.slice(0, -1))));
  if (Q.get('list') === '1') { OUT.textContent = list.map((s) => s.id).join('\n') + '\n== END ==\n'; return; }
  const out = [];
  for (const spec of list) {
    try { out.push(...await dumpOne(spec, d)); } catch (e) { out.push(`== ${spec.id} ==`, `# HARNESS ERROR ${e?.message || e}`); }
    out.push('');
  }
  out.push(`== END ${list.length} surfaces ==`);
  notes.surfaces = list.length;
  NOTES.textContent = JSON.stringify(notes);
  OUT.textContent = out.join('\n') + '\n';
}
main().catch((e) => { OUT.textContent = `HARNESS FAILED ${e?.stack || e}\n`; });
</script>
