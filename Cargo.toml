[workspace]
members = ["host"]
# native/ is its own workspace (GTK 4, a newer glib); see native/Cargo.toml.
exclude = ["native"]
resolver = "2"

# The product version (D-G74a): the one source. The host inherits it; tools/release.py bump rewrites it, the
# win11-host line of Cargo.lock and extension/metadata.json version-name together.
[workspace.package]
version = "0.9.2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
