<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Win11 Shell">
  <!-- Win11 Shell logo — original artwork: a soft four-petal bloom on a rounded tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aa3ff"/>
      <stop offset="0.55" stop-color="#0a6fd8"/>
      <stop offset="1" stop-color="#0646a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#d6ecff" stop-opacity="0.82"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <g transform="translate(128 128)">
    <path d="M0 -6 C 22 -28 46 -40 70 -36 C 74 -12 62 12 40 24 C 24 32 10 22 0 -6 Z" fill="url(#petal)" transform="rotate(-45)"/>
    <path d="M0 -6 C 22 -28 46 -40 70 -36 C 74 -12 62 12 40 24 C 24 32 10 22 0 -6 Z" fill="url(#petal)" fill-opacity="0.86" transform="rotate(45)"/>
    <path d="M0 -6 C 22 -28 46 -40 70 -36 C 74 -12 62 12 40 24 C 24 32 10 22 0 -6 Z" fill="url(#petal)" fill-opacity="0.72" transform="rotate(135)"/>
    <path d="M0 -6 C 22 -28 46 -40 70 -36 C 74 -12 62 12 40 24 C 24 32 10 22 0 -6 Z" fill="url(#petal)" fill-opacity="0.9" transform="rotate(225)"/>
    <circle r="9" fill="#ffffff"/>
  </g>
</svg>
