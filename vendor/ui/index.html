<!doctype html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Win11 Shell</title>
<script>
/* Early theme (before CSS/JS load) so nothing flashes; theme.js takes over. */
(function () {
  try {
    var q = new URLSearchParams(location.search), d = document.documentElement, c = null;
    try { c = JSON.parse(localStorage.getItem('win11shell.themeCache') || 'null'); } catch (e) {}
    var th = q.get('theme');
    d.setAttribute('data-theme', th === 'light' || th === 'dark' ? th : (c && c.mode) || 'dark');
    d.setAttribute('data-surface', q.get('surface') || 'preview');
    if (c && c.palette) {
      var dark = d.getAttribute('data-theme') === 'dark';
      d.style.setProperty('--accent', dark ? c.palette.light2 : c.palette.dark1);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
